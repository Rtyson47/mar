<style>
  :root{
    --ground:#0c0d0f; --panel:#15171a; --line:#26292e;
    --ink:#f3f0ea; --soft:#a9a49b; --accent:#c9a86a;
    --serif:ui-serif,"Iowan Old Style","Hoefler Text",Palatino,Georgia,serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--ground); color:var(--ink); font-family:var(--serif);
    min-height:100dvh; padding:44px 22px 40px;
    display:flex; justify-content:center;
    -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  }
  /* dotwork wash, the only ornament */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:radial-gradient(circle at center,#ffffff14 1px,transparent 1.1px);
    background-size:11px 11px;
    -webkit-mask-image:radial-gradient(ellipse 80% 55% at 50% 0%,#000,transparent 78%);
    mask-image:radial-gradient(ellipse 80% 55% at 50% 0%,#000,transparent 78%);
  }
  .card{position:relative; z-index:1; width:100%; max-width:400px; text-align:center}

  .avatar{
    width:104px; height:104px; margin:0 auto 22px; border-radius:50%;
    border:1px solid var(--line); background:var(--panel);
    display:grid; place-items:center; overflow:hidden;
  }
  .avatar img{width:100%; height:100%; object-fit:cover; display:block}
  .avatar .mono-mark{font-family:var(--serif); font-size:40px; color:var(--accent); letter-spacing:.02em}

  .eyebrow{
    font-family:var(--mono); font-size:10px; letter-spacing:.24em; text-transform:uppercase;
    color:var(--accent); margin:0 0 10px;
  }
  h1{font-size:44px; line-height:1; font-weight:500; margin:0 0 14px; letter-spacing:-.01em}
  .tagline{color:var(--soft); font-size:15.5px; line-height:1.55; margin:0 auto; max-width:31ch}

  .rule{
    height:5px; margin:26px auto 24px; max-width:170px; color:var(--line);
    background-image:radial-gradient(circle at center,currentColor 1.1px,transparent 1.2px);
    background-size:9px 5px;
  }

  .links{display:flex; flex-direction:column; gap:11px; text-align:left}
  a.btn{
    display:flex; align-items:center; gap:14px; min-height:60px; padding:13px 18px;
    background:var(--panel); border:1px solid var(--line); border-radius:3px;
    color:var(--ink); text-decoration:none; transition:border-color .16s, background .16s;
  }
  a.btn:hover,a.btn:focus-visible{background:#1c1f23; border-color:#3a3f46; outline:none}
  a.btn:focus-visible{box-shadow:0 0 0 2px var(--accent)}
  a.btn.primary{border-color:#3c4a3f; background:#151c17}
  a.btn.primary:hover,a.btn.primary:focus-visible{background:#1a231c; border-color:#546a58}

  .ico{flex:none; width:22px; height:22px; color:var(--accent)}
  .ico svg{width:100%; height:100%; display:block; fill:currentColor}
  .txt{display:flex; flex-direction:column; gap:2px; min-width:0}
  .txt b{font-weight:600; font-size:16px; letter-spacing:.005em}
  .txt span{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--soft)}

  footer{margin-top:30px; font-family:var(--mono); font-size:10px; letter-spacing:.14em;
         text-transform:uppercase; color:#6d6963}

  @media (prefers-reduced-motion:no-preference){
    .card{animation:in .5s ease-out both}
    @keyframes in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  }
</style>
